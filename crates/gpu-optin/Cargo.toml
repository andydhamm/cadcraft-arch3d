[package]
name = "cadcraft-gpu-optin"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
wgpu = { workspace = true }

# Not the workspace lints: this crate holds the two wgpu calls marked `unsafe` that the renderer
# opts into, each allowed where it is made, with its safety argument. Everything else stays denied.
[lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
